# A project translates into one executable or library.
project:
  device: ""

  define:
     - USER_VECT_TAB_ADDRESS
     - VECT_TAB_OFFSET: 0x00010000U
     
  add-path:
    - ./RTE/_Debug_STM32F401RCTx/
    - ./lib/inc


  groups:
    - group: Source Files
      files:
        - file: ./app_main.c

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: ARM::CMSIS:CORE
    - component: Device:CubeMX

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
      - bin

  executes:
    - execute: ConvertToUF2
      run: python $input(1)$ -c -b 0x08010000 -f 0x57755A57 -o $output(0)$ $input(0)$
      input:
        - $OutDir()$/App.bin
        - $ProjectDir()$/uf2conv.py
      output:
        - $ProjectDir()$/App.uf2

    - execute: VerifyApp
      run: python $input(2)$ $input(0)$ $input(1)$ $output(0)$
      input:
        - $ProjectDir()$/App.uf2
        - $OutDir()$/App.bin
        - $ProjectDir()$/verify_app.py
      output:
        - $ProjectDir()$/App.verify.txt
